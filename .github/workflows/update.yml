name: Update Free Games

concurrency:
  group: games-data-update
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run static checks
        run: |
          node --check script.js

      - name: Fetch Steam deals
        id: steam
        continue-on-error: true
        timeout-minutes: 7
        run: python steam.py

      - name: Fetch Epic deals
        id: epic
        continue-on-error: true
        timeout-minutes: 5
        run: python epic.py

      - name: Build data files
        env:
          STEAM_OUTCOME: ${{ steps.steam.outcome }}
          EPIC_OUTCOME: ${{ steps.epic.outcome }}
        run: |
          python build_public_feed.py
          python update_timestamp.py

      - name: Validate generated output
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit changes
        run: |
          if git diff --quiet -- deals.json; then
            echo "No public feed changes; skipping commit and Pages deployment"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- free_goods_detail.json epic_goods_detail.json deals.json update_timestamp.json
          git commit -m "chore(data): refresh free-game feed $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      - name: Require at least one available store
        if: steps.steam.outcome == 'failure' && steps.epic.outcome == 'failure'
        run: exit 1

      - name: Keep Actions history tidy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '14 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          run_ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.created_at < \"${cutoff}\") | .id")
          while read -r run_id; do
            if [ -n "$run_id" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            fi
          done <<< "$run_ids"
